services:
  app:
    image: analytics-api:v1
    build:
      context: .
      dockerfile: Dockerfile.web
    # environment:
    #   - PORT=8002
    #   - DATABASE_URL=postgresql+psycopg://time-user:time-pw@hostvalue:5432/timescalesb

    env_file:
      - .env.compose
    environment:
      - ENV=docker
    ports:
      - "8002:8002"
    volumes:
      - ./src:/code/src:rw
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: compose.yaml
  db_service:
    image: timescale/timescaledb:latest-pg17
    environment:
      - POSTGRES_USER=time-user
      - POSTGRES_PASSWORD=time-pw
      - POSTGRES_DB=timescaledb
    ports:
      - "5432:5432"
    expose:
      - 5432
    volumes: 
      - timescaledb_data:/var/lib/postgresql/data
  
volumes: 
  timescaledb_data: